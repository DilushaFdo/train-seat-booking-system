<app-journey-search (search)="onSearch($event)" (selectionsStale)="onSelectionsStale($event)"></app-journey-search>

@if (fromStationId && toStationId && !selectedTripId) {
  <app-train-select
  [fromStationId]="fromStationId"
  [toStationId]="toStationId"
  [date]="selectedDate!"
  (tripSelected)="onTripSelected($event)">
</app-train-select>
}

@if (selectedTripId && fromStationId && toStationId) {
  <app-seat-map
    [tripId]="selectedTripId"
    [fromStationId]="fromStationId"
    [toStationId]="toStationId"
    [refreshTrigger]="refreshKey"
    (seatSelected)="onSeatSelected($event)">
  </app-seat-map>
}

@if (selectedSeat && selectedTripId && fromStationId && toStationId) {
  <app-booking-dialog
    [tripId]="selectedTripId"
    [fromStationId]="fromStationId"
    [toStationId]="toStationId"
    [seat]="selectedSeat"
    (closed)="onDialogClosed()"
    (bookingConfirmed)="onBookingConfirmed()">
  </app-booking-dialog>
}
