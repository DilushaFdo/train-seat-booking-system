<app-journey-search (search)="onSearch($event)"></app-journey-search>

@if (fromStationId && toStationId) {
  <app-seat-map
    [tripId]="tripId"
    [fromStationId]="fromStationId"
    [toStationId]="toStationId"
    [refreshTrigger]="refreshKey"
    (seatSelected)="onSeatSelected($event)">
  </app-seat-map>
}

@if (selectedSeat && fromStationId && toStationId) {
  <app-booking-dialog
    [tripId]="tripId"
    [fromStationId]="fromStationId"
    [toStationId]="toStationId"
    [seat]="selectedSeat"
    (closed)="onDialogClosed()"
    (bookingConfirmed)="onBookingConfirmed()">
  </app-booking-dialog>
}
